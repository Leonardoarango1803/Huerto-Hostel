spring:
  application:
    name: huerto-hostel

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 120000
      max-lifetime: 900000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

server:
  port: ${PORT:8091}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 28800000  # 8 horas

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  # Datos que salen en el comprobante de la estadia (los vacios no se imprimen)
  hotel:
    nombre: ${HOTEL_NOMBRE:El Huerto Hostel}
    ruc: ${HOTEL_RUC:}
    direccion: ${HOTEL_DIRECCION:}
    telefono: ${HOTEL_TELEFONO:}
    correo: ${HOTEL_CORREO:}
    mensaje-pie: ${HOTEL_MENSAJE_PIE:Gracias por su visita}

  caja:
    # Efectivo en caja a partir del cual se avisa que conviene retirar a custodia
    tope-efectivo: ${TOPE_EFECTIVO_CAJA:1000}
    # Horas de un turno abierto a partir de las cuales se avisa que se olvido cerrar (y el administrador puede forzar el cierre)
    horas-maximas-abierta: ${HORAS_MAXIMAS_CAJA_ABIERTA:16}

  decolecta:
    api-key: ${DECOLECTA_API_KEY}
    base-url: https://api.decolecta.com

  reservas:
    # Liberacion automatica de reservas que no se usaron (hora de Lima).
    liberacion-cron: "0 */15 * * * *"
    # Pago minimo, en % del alojamiento, para confirmar una reserva. 0 = sin minimo.
    adelanto-minimo-porcentaje: 0

logging:
  level:
    root: WARN
    pe.edu.utp.huertohostel: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
    org.springframework.web: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
